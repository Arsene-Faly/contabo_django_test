{% extends "layouts/base.html" %}

{% block title %}Inscription - MonBlog{% endblock %}

{% block content %}

<div class="auth-wrapper">
  <div class="auth-box">
    <h1>Inscription</h1>
    <p class="subtitle">Créez votre compte MonBlog</p>

    {% if errors %}
        {% for error in errors %}
            <p style="color: red;">{{ error }}</p>
        {% endfor %}
    {% endif %}

<form method="POST">
  {% csrf_token %}

  <div class="form-group">
    <label for="email">Adresse e-mail</label>
    <input
      type="email"
      id="email"
      name="email"
      placeholder="vous@exemple.com"
      value="{% if errors %}{{ email }}{% endif %}"
    >
  </div>

  <div class="form-group">
    <label for="password">Mot de passe</label>
    <input
      type="password"
      id="password"
      name="password"
      placeholder="••••••••"
    >
  </div>

  <div class="form-group">
    <label for="confirm_password">Confirmer le mot de passe</label>
    <input
      type="password"
      id="confirm_password"
      name="confirm_password"
      placeholder="••••••••"
    >
  </div>

  <div class="form-actions">
    <button type="submit" class="btn btn-primary btn-block">
      Créer mon compte
    </button>
  </div>
</form>

<p class="auth-switch">
  Déjà inscrit ?
  <a href="{% url 'login' %}">Connectez-vous</a>
</p>

  </div>
</div>

{% endblock %}
