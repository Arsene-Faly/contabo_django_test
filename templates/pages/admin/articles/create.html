{% extends "layouts/admin.html" %}

{% block title %}
Nouvel article - Admin MonBlog
{% endblock %}

{% block content %}

<div class="admin-main">

  <div class="admin-topbar">

    <h1>Nouvel article</h1>

    <div class="admin-user">
      <span>Admin</span>
      <div class="avatar">A</div>
    </div>

  </div>

  <div class="admin-content">

    <div class="panel" style="max-width: 760px">

      <h2>Informations de l'article</h2>


      <!-- ========================= -->
      <!-- MESSAGES D'ERREUR -->
      <!-- ========================= -->

      {% if errors %}

        <div class="alert alert-danger">

          {% for error in errors %}

            <p>{{ error }}</p>

          {% endfor %}

        </div>

      {% endif %}


      <!-- ========================= -->
      <!-- FORMULAIRE -->
      <!-- ========================= -->

      <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}


        <div class="form-group">

          <label for="title">
            Titre de l'article
          </label>

          <input
            type="text"
            id="title"
            name="title"
            value="{{ title }}"
            placeholder="Ex : Les bases de Flask pour débutants"
          />

        </div>


        <div class="form-row">

          <div class="form-group">

            <label for="category">
              Catégorie
            </label>

            <select id="category" name="category">

              <option value="">
                -- Choisir une catégorie --
              </option>

              {% for category_item in categories %}

                <option
                  value="{{ category_item.id }}"
                  {% if category == category_item.id|stringformat:"s" %}
                    selected
                  {% endif %}
                >
                  {{ category_item.name }}
                </option>

              {% endfor %}

            </select>

          </div>


          <div class="form-group">

            <label for="status">
              Statut
            </label>

            <select id="status" name="status">

              {% for item in status %}

                <option
                  value="{{ item }}"
                  {% if status_select == item %}
                    selected
                  {% endif %}
                >
                  {{ item }}
                </option>

              {% endfor %}

            </select>

          </div>

        </div>


        <div class="form-group">

          <label for="excerpt">
            Résumé
          </label>

          <textarea
            id="excerpt"
            name="resume"
            placeholder="Court résumé affiché dans la liste des articles"
          >{{ resume }}</textarea>

        </div>


        <div class="form-group">

          <label for="content">
            Contenu
          </label>

          <textarea
            id="content"
            name="contenu"
            style="min-height: 220px"
            placeholder="Rédigez le contenu complet de l'article ici"
          >{{ contenu }}</textarea>

        </div>


        <div class="form-group">

          <label for="cover">
            Image de couverture
          </label>

          <input
            type="file"
            id="cover"
            name="image"
          />

        </div>


        <div class="form-actions">

          <button
            type="submit"
            class="btn btn-primary"
          >
            Publier l'article
          </button>

          <a
            href="{% url 'article_index' %}"
            class="btn btn-outline"
          >
            Annuler
          </a>

        </div>

      </form>

    </div>

  </div>

</div>

{% endblock %}
